# Linux-Desktop: nginx — noVNC im Browser (Port 80)
# noVNC (LGPL, Open Source) liefert den Browser-Client; das WebSocket wird
# zu websockify (127.0.0.1:6080) und dort zu x11vnc (127.0.0.1:5900) proxied.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/novnc;
    index index.html vnc.html;

    # noVNC-Client (statische Dateien)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # WebSocket-Proxy Richtung x11vnc
    location /websockify/ {
        proxy_pass http://127.0.0.1:6080/websockify/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
    }
}
